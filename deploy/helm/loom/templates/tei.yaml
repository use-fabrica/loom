{{- /*
Optional in-cluster Embedder (text-embeddings-inference) so a cluster can
run without a hosted embeddings API key. Disabled by default; when enabled,
also set config.CE_EMBEDDER_BASE_URL to this Service (see NOTES.txt).
*/ -}}
{{- if .Values.embedder.local.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.fullname" . }}-tei
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loom.name" . }}-tei
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "loom.name" . }}-tei
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: tei
          image: {{ .Values.embedder.local.image }}
          args:
            - "--model-id"
            - {{ .Values.embedder.local.model | quote }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.embedder.local.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.fullname" . }}-tei
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "loom.name" . }}-tei
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
