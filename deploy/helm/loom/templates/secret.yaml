{{- /*
Skip rendering when the caller supplies existingSecret: they own the Secret
carrying CE_DATABASE_URL and CE_EMBEDDER_API_KEY.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loom.fullname" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
type: Opaque
stringData:
  CE_DATABASE_URL: {{ include "loom.databaseUrl" . | quote }}
  CE_EMBEDDER_API_KEY: {{ .Values.secrets.CE_EMBEDDER_API_KEY | quote }}
{{- end }}
