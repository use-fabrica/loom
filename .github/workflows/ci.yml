name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pinned tag as deploy/compose/docker-compose.yaml and
        # deploy/helm/loom/values.yaml (ADR-0007: pgvector >= 0.8.0). The
        # image's own POSTGRES_USER is a superuser, which testpg.New needs
        # to create and drop per-test databases on this admin DSN.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
        env:
          CE_TEST_DATABASE_URL: postgres://loom:loom@localhost:5432/loom?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v2 line, matching the devshell's golangci-lint; the action's
      # "latest" resolves to a v1 build too old for this Go toolchain.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: >-
            ./cmd/server/... ./internal/api/... ./internal/domain/...
            ./internal/embed/... ./internal/engine/... ./internal/store/...
            ./internal/testpg/... ./internal/config/...
